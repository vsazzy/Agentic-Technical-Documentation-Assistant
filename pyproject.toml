[project]
name = "local-sdk-rag-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "docling",
    "langchain>=1.3.1",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-core>=1.4.0",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "pandas>=3.0.3",
    "pypdf>=6.11.0",
    "pymupdf",
    "pytest",
    "python-dotenv>=1.2.2",
    "slack-bolt>=1.28.0",
    "streamlit>=1.57.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    # PyMuPDF 1.29.0's compiled SWIG bindings emit these at import time. The
    # warning location is synthetic (<frozen importlib._bootstrap>), so no
    # dependency module name is available for a module-scoped filter.
    "ignore:^builtin type SwigPyPacked has no __module__ attribute$:DeprecationWarning",
    "ignore:^builtin type SwigPyObject has no __module__ attribute$:DeprecationWarning",
    "ignore:^builtin type swigvarlink has no __module__ attribute$:DeprecationWarning",
]
